<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新座市グリーンサポーター活動カレンダー</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<header class="app-header">
  <h1>🌳 新座市グリーンサポーター活動カレンダー(令和8年度)</h1>
  <a href="admin.html">管理者ログイン</a>
</header>

<main>
  <p class="notice">
    緑地の整備ボランティア「グリーンサポーター(GS)」の活動予定をカレンダーで確認できます。
    日付をクリックすると活動場所・内容・注意点などの詳細が表示されます。
    活動に参加された方は、感想や改善点をぜひ投稿してください。
  </p>

  <div class="calendar-nav">
    <button id="prevMonthBtn">&lt; 前月</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextMonthBtn">次月 &gt;</button>
  </div>

  <div class="calendar-grid" id="calendarGrid"></div>
</main>

<!-- 活動詳細モーダル -->
<div class="modal-overlay hidden" id="detailModal">
  <div class="modal">
    <button class="close-btn" id="closeModalBtn">&times;</button>
    <h2 id="modalDate"></h2>
    <span class="status-mark" id="modalStatus"></span>

    <div class="modal-section">
      <h3>活動場所</h3>
      <div id="modalLocationName"></div>
      <div id="map"></div>
    </div>

    <div class="modal-section">
      <h3>活動内容</h3>
      <div id="modalContent"></div>
    </div>

    <div class="modal-section">
      <h3>注意点</h3>
      <div id="modalNotes"></div>
    </div>

    <div class="modal-section">
      <h3>感想・改善点を投稿</h3>
      <form id="feedbackForm">
        <div class="field">
          <label for="feedbackName">お名前(任意)</label>
          <input type="text" id="feedbackName" placeholder="例: 新座 太郎">
        </div>
        <div class="field">
          <label for="feedbackComment">感想・改善点</label>
          <textarea id="feedbackComment" required placeholder="活動の感想や、今後への改善提案などをご記入ください"></textarea>
        </div>
        <button type="submit" class="btn">投稿する</button>
      </form>
    </div>

    <div class="modal-section">
      <h3>みんなの感想</h3>
      <ul class="feedback-list" id="feedbackList"></ul>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
